name: Build and Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-26.04
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Install scripts stay off (the build needs none) and AWS credentials are
      # only configured after install and build, so dependency code never runs
      # with them in reach - the path npm worms use to steal cloud credentials.
      - run: npm ci --ignore-scripts

      - name: Build
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then
            npm run build:staging
          else
            npm run build
          fi
        env:
          VITE_NOINDEX: ${{ inputs.environment == 'staging' && 'true' || 'false' }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/heirdock-website-${{ inputs.environment }}-github-deploy
          aws-region: ${{ vars.AWS_REGION }}

      # The order of the next four steps is what keeps a deploy (or a rollback)
      # free of downtime: new hashed assets go up first with nothing deleted,
      # then the HTML that references them, then the CDN purge. Stale assets
      # are pruned only after the invalidation has finished, so live HTML never
      # points at a deleted file. The build is one JS and one CSS bundle with no
      # lazy chunks, so a tab still open on the old HTML already holds its assets.
      - name: Upload static assets to S3
        run: |
          aws s3 sync dist/client/ s3://heirdock-website-${{ inputs.environment }}-frontend \
            --exclude "*.html" \
            --exclude "*.json" \
            --cache-control "max-age=31536000,public"

      - name: Deploy HTML files to S3
        run: |
          aws s3 sync dist/client/ s3://heirdock-website-${{ inputs.environment }}-frontend \
            --exclude "*" \
            --include "*.html" \
            --include "*.json" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query Invalidation.Id \
            --output text)
          # Polls every 20s for up to 10 min. If it times out the new site is
          # already live; the job fails before pruning, which only leaves stale
          # assets in the bucket until the next deploy.
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --id "$INVALIDATION_ID"

      - name: Prune stale assets from S3
        run: |
          aws s3 sync dist/client/ s3://heirdock-website-${{ inputs.environment }}-frontend \
            --exclude "*.html" \
            --exclude "*.json" \
            --cache-control "max-age=31536000,public" \
            --delete
